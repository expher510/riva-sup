name: Riva Automated Media Scraper

on:
  schedule:
    # Run every 2 hours automatically
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions UI

jobs:
  scrape-and-ingest:
    name: Scrape & Ingest to Riva Engine
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run Scraper & Push to Riva VPS
        env:
          RIVA_API_BASE: ${{ secrets.RIVA_API_BASE || 'http://186.240.145.87:8090' }}
          RIVA_SECRET_KEY: ${{ secrets.RIVA_SECRET_KEY || 'riva_ingest_token_2026' }}
        run: |
          python scripts/github_scraper.py
