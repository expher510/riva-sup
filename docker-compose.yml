services:
  postgres:
    image: postgres:16-alpine
    container_name: riva_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c max_connections=150
      -c jit=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riva_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riva_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-riva_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riva_user} -d ${POSTGRES_DB:-riva_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - riva_internal_net
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: riva_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--requirepass", "${REDIS_PASSWORD:-redis_secure_password}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - riva_internal_net
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riva_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips="*" --no-access-log
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-riva_user}:${POSTGRES_PASSWORD:-riva_secure_password}@postgres:5432/${POSTGRES_DB:-riva_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DELIVERY_BOT_TOKEN=${DELIVERY_BOT_TOKEN:-}
      - DELIVERY_BOT_USERNAME=${DELIVERY_BOT_USERNAME:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - BOT_ADMIN_PASSWORD=${BOT_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:8000"
    networks:
      - riva_internal_net
    ports:
      - "127.0.0.1:5432:5432"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riva_worker
    restart: unless-stopped
    command: nice -n 10 celery -A worker.celery_app.celery_app worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-5} -O fair --without-gossip --without-mingle --without-heartbeat
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-riva_user}:${POSTGRES_PASSWORD:-riva_secure_password}@postgres:5432/${POSTGRES_DB:-riva_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-riva_user}:${POSTGRES_PASSWORD:-riva_secure_password}@postgres:5432/${POSTGRES_DB:-riva_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/2
      - TMDB_API_KEY=${TMDB_API_KEY}
      - ENABLE_EXTERNAL_STREAM_UPLOAD=0
      - TURKISH_PRIORITY_ONLY=1
      - SERIES_VIRAL_PRIORITY_ENABLED=1
      - MOVIE_VIRAL_PRIORITY_ENABLED=1
      - MAX_CONCURRENT_MOVIE_JOBS=${MAX_CONCURRENT_MOVIE_JOBS:-2}
      - MAX_CONCURRENT_SERIES_CHAINS=${MAX_CONCURRENT_SERIES_CHAINS:-3}
      - HLS_PARALLEL_WORKERS=${HLS_PARALLEL_WORKERS:-8}
      - TELEGRAM_UPLOAD_WORKERS=${TELEGRAM_UPLOAD_WORKERS:-3}
      - FFMPEG_ENCODE_THREADS=${FFMPEG_ENCODE_THREADS:-4}
      - PYTHONDONTWRITEBYTECODE=1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DELIVERY_BOT_TOKEN=${DELIVERY_BOT_TOKEN:-}
      - DELIVERY_BOT_USERNAME=${DELIVERY_BOT_USERNAME:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - BOT_ADMIN_PASSWORD=${BOT_ADMIN_PASSWORD}
      - TRANSIT_TEMP_DIR=/tmp/riva_transit
    volumes:
      - transit_scratch:/tmp/riva_transit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - riva_internal_net
    ports:
      - "127.0.0.1:5432:5432"

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riva_orchestrator
    restart: unless-stopped
    command: nice -n 5 python -m worker.orchestrator
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-riva_user}:${POSTGRES_PASSWORD:-riva_secure_password}@postgres:5432/${POSTGRES_DB:-riva_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-riva_user}:${POSTGRES_PASSWORD:-riva_secure_password}@postgres:5432/${POSTGRES_DB:-riva_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/2
      - TMDB_API_KEY=${TMDB_API_KEY}
      - ENABLE_EXTERNAL_STREAM_UPLOAD=0
      - TURKISH_PRIORITY_ONLY=1
      - SERIES_VIRAL_PRIORITY_ENABLED=1
      - MOVIE_VIRAL_PRIORITY_ENABLED=1
      - MAX_CONCURRENT_MOVIE_JOBS=${MAX_CONCURRENT_MOVIE_JOBS:-2}
      - MAX_CONCURRENT_SERIES_CHAINS=${MAX_CONCURRENT_SERIES_CHAINS:-3}
      - ORCH_TICK_SECONDS=${ORCH_TICK_SECONDS:-40}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DELIVERY_BOT_TOKEN=${DELIVERY_BOT_TOKEN:-}
      - DELIVERY_BOT_USERNAME=${DELIVERY_BOT_USERNAME:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - BOT_ADMIN_PASSWORD=${BOT_ADMIN_PASSWORD}
      - TRANSIT_TEMP_DIR=/tmp/riva_transit
    volumes:
      - transit_scratch:/tmp/riva_transit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - riva_internal_net
    ports:
      - "127.0.0.1:5432:5432"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riva_bot
    restart: unless-stopped
    command: python -m bot.main
    environment:
      - ENVIRONMENT=production
      - POSTGRES_USER=${POSTGRES_USER:-riva_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-riva_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-riva_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DELIVERY_BOT_TOKEN=${DELIVERY_BOT_TOKEN:-}
      - DELIVERY_BOT_USERNAME=${DELIVERY_BOT_USERNAME:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - BOT_ADMIN_PASSWORD=${BOT_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - riva_internal_net
    ports:
      - "127.0.0.1:5432:5432"


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  transit_scratch:
    driver: local

networks:
  riva_internal_net:
    driver: bridge
